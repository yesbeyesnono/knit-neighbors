<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>뜨개동네 관리자</title>
<style>
:root{--ink:#111;--ink2:#444;--ink3:#8a8a8a;--line:#e6e6e6;--bg:#fff;--bg2:#f6f6f6;--red:#c9303f;--green:#2f6b3a;--amber:#8a6d1a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:var(--ink);background:var(--bg2);word-break:keep-all}
a{color:inherit}
#gate{max-width:420px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center}
#app{display:none;grid-template-columns:200px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:14px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .brand{padding:6px 16px 14px;font-weight:800;font-size:15px}
aside .brand small{display:block;color:var(--ink3);font-weight:400;font-size:11px;margin-top:2px}
aside .grp{padding:10px 16px 4px;font-size:11px;color:var(--ink3)}
aside a{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;text-decoration:none;color:var(--ink2);font-size:13.5px}
aside a.on{background:#111;color:#fff}
aside a .n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;min-width:18px;text-align:center}
aside a.on .n{background:#fff;color:#111}
main{padding:22px 26px 60px;min-width:0}
h1{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h1 small{font-size:12px;color:var(--ink3);font-weight:400}
h2{font-size:15px;margin:22px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .l{font-size:12px;color:var(--ink3)}.card .v{font-size:22px;font-weight:700;margin-top:2px}
.card .s{font-size:12px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg2);font-weight:600;color:var(--ink2);font-size:12px}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#fafafa}
.muted{color:var(--ink3);font-size:12px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#f0f0f0;color:#333;margin-right:4px}
.chip.r{background:#fde8ea;color:var(--red)}.chip.g{background:#e8f3e8;color:var(--green)}.chip.y{background:#fbf6e6;color:var(--amber)}
button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
button.p{background:#111;color:#fff;border-color:#111}button.r{color:var(--red);border-color:#f2c9ce}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{width:100%;min-height:90px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tabs{display:flex;gap:6px;margin:0 0 12px}.tabs button.on{background:#111;color:#fff;border-color:#111}
.panel{position:fixed;top:0;right:0;width:min(560px,100%);height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.08);padding:20px 22px;overflow-y:auto;display:none;z-index:50}
.panel.on{display:block}.panel .x{position:fixed;top:12px;right:18px;z-index:60;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:49;display:none}#scrim.on{display:block}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.bar{display:flex;align-items:flex-end;gap:2px;height:80px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.bar i{flex:1;background:#111;border-radius:2px 2px 0 0;min-height:1px;position:relative}
.bar i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.hbar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.hbar b{height:12px;background:#111;border-radius:3px;display:block}
.hbar .w{background:var(--bg2);border-radius:3px}
.msg{padding:6px 10px;border-radius:12px;background:var(--bg2);margin:4px 0;max-width:80%;font-size:13px}
.msg.sup{background:#111;color:#fff;margin-left:auto}
.msg time{display:block;font-size:10px;opacity:.6;margin-top:2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
pre{background:var(--bg2);border-radius:8px;padding:10px;font-size:12px;overflow:auto;white-space:pre-wrap}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:2px;padding:8px}aside .brand,aside .grp{width:100%}aside a{padding:6px 10px;border-radius:8px}main{padding:14px}}
</style></head>
<body>
<div id="gate">
  <div style="font-size:22px;font-weight:800">뜨개동네 관리자</div>
  <p class="muted" id="gateMsg">관리자 계정으로 로그인하세요</p>
  <button class="p" id="gateBtn" onclick="login()">Google로 로그인</button>
  <div style="margin-top:10px"><button onclick="logout()" id="gateOut" style="display:none">다른 계정으로</button></div>
</div>
<div id="app">
  <aside>
    <div class="brand">뜨개동네 관리자<small id="who"></small></div>
    <div class="grp">현황</div>
    <a href="#dash" data-v="dash">대시보드</a>
    <a href="#dong" data-v="dong">동네 분포</a>
    <a href="#content" data-v="content">글·모임·인증</a>
    <div class="grp">운영</div>
    <a href="#reports" data-v="reports">신고함 <span class="n" id="nRep" hidden></span></a>
    <a href="#users" data-v="users">사용자</a>
    <a href="#support" data-v="support">지기 문의함 <span class="n" id="nSup" hidden></span></a>
    <a href="#banned" data-v="banned">금칙어</a>
    <a href="#broadcast" data-v="broadcast">공지·알림 보내기</a>
    <a href="#shops" data-v="shops">파트너 가게</a>
    <div class="grp">AI 데이터</div>
    <a href="#ai-photos" data-v="ai-photos">사진↔기법 라벨</a>
    <a href="#ai-path" data-v="ai-path">학습 경로</a>
    <a href="#ai-qa" data-v="ai-qa">질문·해결 답글</a>
    <a href="#ai-yarn" data-v="ai-yarn">실·바늘 통계</a>
    <a href="#export" data-v="export">내보내기</a>
    <div class="grp">시스템</div>
    <a href="#logs" data-v="logs">관리자 로그</a>
    <a href="#settings" data-v="settings">설정</a>
    <div style="padding:14px 16px"><button onclick="logout()" style="width:100%">로그아웃</button></div>
  </aside>
  <main id="main"></main>
</div>
<div id="scrim" onclick="closePanel()"></div>
<div class="panel" id="panel"><button class="x" onclick="closePanel()">✕</button><div id="panelBody"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://thfcrodfaitzrzlrxyir.supabase.co', SB_KEY='sb_publishable_lOC6sE1BIpj5JZPnpwPCpg_DxvVvT2y';
const SUPPORT_ID='e120eb67-b254-4008-92d8-08c95c821e9e';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const fmtd=t=>t?new Date(t).toLocaleDateString('ko-KR'):'';
const ago=t=>{const d=(Date.now()-new Date(t))/1000; if(d<3600) return Math.max(1,Math.floor(d/60))+'분 전'; if(d<86400) return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전';};
const lv=p=>[p.level_crochet>0?'코바늘 '+p.level_crochet:'',p.level_knit>0?'대바늘 '+p.level_knit:''].filter(Boolean).join(' · ');
function toast(t){const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200);}
let me=null, TECH={}, STATS=null;
async function login(){ const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href.split('#')[0] } }); if(error) toast(error.message); }
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ return; }
  me=session.user; $('#gateMsg').textContent='권한 확인 중… ('+me.email+')'; $('#gateOut').style.display='inline-block';
  const { data:ok, error } = await sb.rpc('is_admin');
  if(error||!ok){ $('#gateMsg').textContent='이 계정('+me.email+')은 관리자가 아니에요. 설정에서 관리자로 등록된 계정으로 로그인하세요.'; $('#gateBtn').style.display='none'; return; }
  $('#gate').style.display='none'; $('#app').style.display='grid'; $('#who').textContent=me.email;
  const { data:t } = await sb.from('techniques').select('id,name_ko,craft,level'); (t||[]).forEach(x=>TECH[x.id]=x);
  refreshBadges(); route();
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN' && !me) init(); });
window.addEventListener('hashchange', route);
async function refreshBadges(){
  const [{count:a},{count:b}] = await Promise.all([sb.from('post_reports').select('*',{count:'exact',head:true}).is('reviewed_at',null), sb.from('reports').select('*',{count:'exact',head:true}).is('reviewed_at',null)]);
  const n=(a||0)+(b||0); $('#nRep').hidden=!n; $('#nRep').textContent=n;
  const sup=await supportRooms(); const un=sup.filter(r=>r.unanswered).length; $('#nSup').hidden=!un; $('#nSup').textContent=un;
}
const VIEWS={};
function route(){ const v=(location.hash||'#dash').slice(1); document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.v===v)); closePanel(); $('#main').innerHTML='<div class="muted">불러오는 중…</div>'; (VIEWS[v]||VIEWS.dash)().catch(e=>{ $('#main').innerHTML='<div class="muted">오류: '+esc(e.message)+'</div>'; }); }
function openPanel(html){ $('#panelBody').innerHTML=html; $('#panel').classList.add('on'); $('#scrim').classList.add('on'); }
function closePanel(){ $('#panel').classList.remove('on'); $('#scrim').classList.remove('on'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#panel').classList.contains('on') && !['TEXTAREA','INPUT'].includes(document.activeElement?.tagName)) closePanel(); else if(e.key==='Escape' && $('#panel').classList.contains('on')){ document.activeElement.blur(); } });
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
const jsonl=rows=>rows.map(r=>JSON.stringify(r)).join('\n');
const csv=(rows,cols)=>[cols.join(',')].concat(rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n');
async function stats(force){ if(STATS&&!force) return STATS; const { data, error } = await sb.rpc('admin_stats'); if(error) throw error; STATS=data; return data; }

// ===== 대시보드 =====
VIEWS.dash = async()=>{
  const s=await stats(true); const t=s.totals;
  const bar=(key,label)=>{ const max=Math.max(1,...s.daily.map(d=>d[key])); return `<div class="card"><div class="l">${label} · 최근 30일 (합계 ${s.daily.reduce((a,d)=>a+d[key],0)})</div><div class="bar">${s.daily.map(d=>`<i style="height:${Math.round(d[key]/max*100)}%" data-t="${d.d.slice(5)} · ${d[key]}"></i>`).join('')}</div></div>`; };
  const lvRow=(obj,label)=>`<div class="hbar"><span>${label}</span><span class="w">${[1,2,3,4,5].map(l=>`<span class="chip">${l}단계 ${obj[l]||0}</span>`).join('')}</span><span class="muted">${obj[0]||0} 없음</span></div>`;
  $('#main').innerHTML=`<h1>대시보드 <small>${new Date().toLocaleString('ko-KR')}</small></h1>
  <div class="cards">
    <div class="card"><div class="l">가입자</div><div class="v">${t.users}</div><div class="s">온보딩 완료 ${t.onboarded} · 정지 ${t.suspended}</div></div>
    <div class="card"><div class="l">활성 사용자</div><div class="v">${t.active7}</div><div class="s">7일 · 30일 ${t.active30}</div></div>
    <div class="card"><div class="l">글 / 답글</div><div class="v">${t.posts} / ${t.replies}</div><div class="s">좋아요·답글 활동 포함</div></div>
    <div class="card"><div class="l">작품 인증</div><div class="v">${t.works}</div><div class="s">해결된 질문 ${s.solved.solved}/${s.solved.questions_with_replies}</div></div>
    <div class="card"><div class="l">모임</div><div class="v">${t.meetups}</div><div class="s">예정 ${t.upcoming}</div></div>
    <div class="card"><div class="l">채팅</div><div class="v">${t.messages}</div><div class="s">방 ${t.rooms} · 친구 관계 ${t.friendships}</div></div>
    <div class="card"><div class="l">친구 찾는 중(손 들기)</div><div class="v">${t.waving}</div></div>
    <div class="card" style="${t.reports_open?'border-color:#c9303f':''}"><div class="l">미처리 신고</div><div class="v" style="${t.reports_open?'color:#c9303f':''}">${t.reports_open}</div><div class="s"><a href="#reports">신고함 열기</a></div></div>
  </div>
  <div class="cards">${bar('signups','가입')}${bar('posts','글·답글')}${bar('works','작품 인증')}${bar('messages','채팅 메시지')}</div>
  <h2>뜨개 단계 분포</h2><div class="card">${lvRow(s.levels.crochet,'코바늘')}${lvRow(s.levels.knit,'대바늘')}</div>`;
};
// ===== 동네 분포 =====
VIEWS.dong = async()=>{
  const s=await stats(); const max=Math.max(1,...s.dong.map(d=>d.n));
  $('#main').innerHTML=`<h1>동네 분포 <small>사용자 프로필의 행정동 기준 · 상위 40</small></h1><div class="card">${s.dong.map(d=>`<div class="hbar"><span>${esc(d.dong)}</span><span class="w"><b style="width:${Math.round(d.n/max*100)}%"></b></span><span class="muted">${d.n}</span></div>`).join('')||'<div class="muted">데이터 없음</div>'}</div>`;
};
// ===== 신고함 =====
let repTab='open';
VIEWS.reports = async()=>{
  const open = repTab==='open';
  const [{data:pr},{data:ur}] = await Promise.all([
    sb.from('post_reports').select('post_id,reporter_id,reason,detail,created_at,reviewed_at, post:posts(id,body,photos,hidden,author_id,parent_id,created_at, author:profiles!posts_author_id_fkey(id,nickname,suspended_at)), reporter:profiles!post_reports_reporter_id_fkey(nickname)')[open?'is':'not']('reviewed_at',null).order('created_at',{ascending:false}).limit(200),
    sb.from('reports').select('id,reporter_id,reported_id,reason,detail,message_id,created_at,reviewed_at, reported:profiles!reports_reported_id_fkey(id,nickname,suspended_at), reporter:profiles!reports_reporter_id_fkey(nickname)')[open?'is':'not']('reviewed_at',null).order('created_at',{ascending:false}).limit(200)
  ]);
  const groups={}; (pr||[]).forEach(r=>{ (groups[r.post_id] ||= {post:r.post, list:[]}).list.push(r); });
  const prow=Object.values(groups).map(g=>{ const p=g.post||{}; return `<tr class="clk" onclick="openPostPanel('${p.id}')"><td><span class="chip r">글</span></td><td>${esc((p.body||'').slice(0,80))||'<span class="muted">(사진만)</span>'} ${p.hidden?'<span class="chip y">숨김</span>':''}<div class="muted">${esc(p.author?.nickname||'')} · ${fmt(p.created_at)} · 사유: ${[...new Set(g.list.map(r=>r.reason))].join(', ')}</div></td><td>${g.list.length}명<div class="muted">${g.list.map(r=>esc(r.reporter?.nickname||'')).join(', ')}</div></td><td onclick="event.stopPropagation()">${open?`<button onclick="hidePost('${p.id}',${!p.hidden})">${p.hidden?'복구':'숨김'}</button> <button class="r" onclick="delPost('${p.id}')">삭제</button> <button onclick="resolveReport('post','${p.id}')">무시</button>`:`<span class="muted">${fmt(g.list[0].reviewed_at)}</span>`}</td></tr>`; }).join('');
  const urow=(ur||[]).map(r=>`<tr class="clk" onclick="openUserPanel('${r.reported_id}')"><td><span class="chip y">사용자</span></td><td><b>${esc(r.reported?.nickname||'(탈퇴)')}</b> ${r.reported?.suspended_at?'<span class="chip r">정지 중</span>':''}<div class="muted">사유: ${esc(r.reason)} ${r.detail?'· '+esc(r.detail):''} · ${fmt(r.created_at)}</div></td><td>${esc(r.reporter?.nickname||'')}</td><td onclick="event.stopPropagation()">${open?`<button class="r" onclick="suspendUser('${r.reported_id}',${!r.reported?.suspended_at})">${r.reported?.suspended_at?'정지 해제':'정지'}</button> <button onclick="resolveReport('user','${r.id}')">무시</button>`:`<span class="muted">${fmt(r.reviewed_at)}</span>`}</td></tr>`).join('');
  $('#main').innerHTML=`<h1>신고함</h1><div class="tabs"><button class="${open?'on':''}" onclick="repTab='open';route()">미처리</button><button class="${!open?'on':''}" onclick="repTab='done';route()">처리됨</button></div>
  <table><tr><th style="width:70px">종류</th><th>내용</th><th style="width:140px">신고자</th><th style="width:230px">처리</th></tr>${prow+urow||'<tr><td colspan="4" class="muted">없음</td></tr>'}</table>
  <p class="muted">글은 신고 3건이 쌓이면 자동으로 숨겨지고 작성자에게만 보여요. 숨김·정지·삭제는 모두 관리자 로그에 남습니다.</p>`;
};
async function hidePost(id, hidden){ const reason=prompt(hidden?'숨김 사유(선택)':'복구 사유(선택)')??null; const {error}=await sb.rpc('admin_hide_post',{p_post:id,p_hidden:hidden,p_reason:reason}); if(error) return toast(error.message); toast(hidden?'글을 숨겼어요':'복구했어요'); refreshBadges(); route(); }
async function delPost(id){ if(!confirm('글과 답글·좋아요를 완전히 삭제해요. 되돌릴 수 없어요. 계속할까요?')) return; const reason=prompt('삭제 사유(선택)')??null; const {error}=await sb.rpc('admin_delete_post',{p_post:id,p_reason:reason}); if(error) return toast(error.message); toast('삭제했어요'); refreshBadges(); route(); }
async function suspendUser(id, suspend){ const reason=suspend?prompt('정지 사유(선택). 정지되면 지도·글·채팅에서 보이지 않고 활동이 막혀요'):null; if(suspend&&reason===null) return; const {error}=await sb.rpc('admin_suspend_user',{p_user:id,p_suspend:suspend,p_reason:reason}); if(error) return toast(error.message); toast(suspend?'정지했어요':'정지를 해제했어요'); refreshBadges(); route(); }
async function resolveReport(kind, id){ const {error}=await sb.rpc('admin_resolve_report',{p_kind:kind,p_id:String(id)}); if(error) return toast(error.message); toast('처리됨으로 옮겼어요'); refreshBadges(); route(); }
async function openPostPanel(id){

async function shrinkImage(file, max){
  const draw=(src,w,h)=>{ const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',0.85)); };
  if(window.createImageBitmap){ try{ const bm=await createImageBitmap(file,{imageOrientation:'from-image'}); const out=await draw(bm,bm.width,bm.height); bm.close?.(); if(out) return out; }catch(e){} }
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=async()=>{ const out=await draw(img,img.width,img.height); URL.revokeObjectURL(img.src); out?res(out):rej(new Error('사진을 처리하지 못했어요')); }; img.onerror=()=>rej(new Error('이 사진 형식은 열 수 없어요. JPG/PNG로 올려 주세요')); img.src=URL.createObjectURL(file); });
}

    const up=await sb.storage.from('chat-photos').upload(path, blob, {contentType:'image/jpeg', upsert:false}); if(up.error) throw new Error(up.error.message);

function parseGeo(hex){ try{ if(typeof hex!=='string')return null; const b=new Uint8Array(hex.match(/../g).map(h=>parseInt(h,16))); const dv=new DataView(b.buffer); const le=b[0]===1; let o=5; const type=dv.getUint32(1,le); if(type&0x20000000)o+=4; const x=dv.getFloat64(o,le), y=dv.getFloat64(o+8,le); return {lat:y,lng:x}; }catch(e){ return null; } }
async function geocodeShop(){ const q=$('#shAddr').value.trim(); if(!q) return toast('주소를 입력하세요'); $('#shGeoMsg').textContent='찾는 중…'; try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(q)); const j=await r.json(); if(!j.length){ $('#shGeoMsg').textContent='못 찾았어요. 영문 주소나 지번으로 다시 시도하거나 좌표를 직접 입력하세요'; return; } $('#shLat').value=(+j[0].lat).toFixed(6); $('#shLng').value=(+j[0].lon).toFixed(6); $('#shGeoMsg').textContent='찾음: '+j[0].display_name.slice(0,60); }catch(e){ $('#shGeoMsg').textContent='조회 실패'; } }
async function findOwner(){ const q=$('#shOwnerQ').value.trim(); const {data}=await sb.rpc('admin_find_users',{p_q:q,p_limit:8}); $('#ownerSel').innerHTML=(data||[]).map(u=>`<button data-id="${u.id}" data-n="${esc(u.nickname)}" onclick="pickOwner(this)">${esc(u.nickname)} · ${esc(u.email)}</button>`).join(' ')||'<span class="muted">없음</span>'; }
function pickOwner(b){ $('#shOwnerId').value=b.dataset.id; $('#ownerCur').textContent='선택: '+b.dataset.n; }
async function saveShop(id){
  const p={ name:$('#shName').value.trim(), kind:$('#shKind').value, address:$('#shAddr').value.trim()||null, descr:$('#shDescr').value.trim()||null, hours:$('#shHours').value.trim()||null, phone:$('#shPhone').value.trim()||null, links:{instagram:$('#lkInsta').value.trim()||undefined, store:$('#lkStore').value.trim()||undefined, web:$('#lkWeb').value.trim()||undefined}, radius_m:+$('#shRadius').value||5000, is_active:$('#shActive').checked, owner_id:$('#shOwnerId').value||'' };
  if(!p.name) return toast('가게 이름을 입력하세요');
  if($('#shLat').value&&$('#shLng').value){ p.lat=+$('#shLat').value; p.lng=+$('#shLng').value; }
  if(id) p.id=id;
  const {error}=await sb.rpc('admin_upsert_shop',{p}); if(error) return toast(error.message); toast('저장했어요'); closePanel(); route();
}
function openShopPostForm(shopId){ openPanel(`<h2 style="margin-top:0">가게 소식 올리기 (관리자 대신 작성)</h2>
  <div class="row"><select id="spKind">${Object.entries(SPOST_KIND).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input id="spEnds" type="date"><span class="muted">마감일(선택)</span></div>
  <input id="spTitle" placeholder="제목" style="width:100%;margin:6px 0"><textarea id="spBody" placeholder="내용"></textarea>
  <input id="spPhotos" placeholder="사진 URL (쉼표로 구분, 선택)" style="width:100%;margin:6px 0">
  <div class="row"><button class="p" onclick="saveShopPost('${shopId}')">올리기</button><button onclick="openShopForm('${shopId}')">취소</button></div>`); }
async function saveShopPost(shopId){ const title=$('#spTitle').value.trim(); if(!title) return toast('제목을 입력하세요'); const photos=$('#spPhotos').value.split(',').map(x=>x.trim()).filter(Boolean); const ends=$('#spEnds').value?new Date($('#spEnds').value+'T23:59:59').toISOString():null; const {error}=await sb.rpc('admin_shop_post',{p:{shop_id:shopId,kind:$('#spKind').value,title,body:$('#spBody').value.trim()||null,photos,ends_at:ends}}); if(error) return toast(error.message); toast('올렸어요. 팔로워에게 알림이 갔어요'); openShopForm(shopId); }
async function hideShopPost(id, hidden){ const {error}=await sb.rpc('admin_shop_post',{p:{id,hidden}}); if(error) return toast(error.message); toast(hidden?'숨겼어요':'복구했어요'); route(); }

  const ids=[...new Set((data||[]).map(l=>l.admin_id))]; const {data:ps}=ids.length?await sb.from('profiles').select('id,nickname').in('id',ids):{data:[]}; const nm={}; (ps||[]).forEach(p=>nm[p.id]=p.nickname);
  const L={hide_post:'글 숨김',unhide_post:'글 복구',delete_post:'글 삭제',suspend_user:'사용자 정지',unsuspend_user:'정지 해제',resolve_report:'신고 무시',add_banned:'금칙어 추가',remove_banned:'금칙어 삭제',broadcast:'공지 발송',add_admin:'관리자 지정',remove_admin:'관리자 해제',reply_support:'지기 답장',upsert_shop:'가게 저장',shop_post:'가게 소식'};
  $('#main').innerHTML=`<h1>관리자 로그 <small>최근 300건 · 삭제 불가</small></h1><table><tr><th>시각</th><th>관리자</th><th>행위</th><th>대상</th><th>상세</th></tr>${(data||[]).map(l=>`<tr><td class="muted">${fmt(l.created_at)}</td><td>${esc(nm[l.admin_id]||l.admin_id.slice(0,8))}</td><td>${L[l.action]||esc(l.action)}</td><td class="muted">${esc(l.target_type||'')} ${esc((l.target_id||'').slice(0,18))}</td><td class="muted">${l.detail?esc(JSON.stringify(l.detail)).slice(0,120):''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">없음</td></tr>'}</table>`;
};

  <p class="muted">추가: 사용자 메뉴에서 검색 › 상세 › "관리자로 지정". 관리자 계정은 반드시 Google 2단계 인증을 켜 두세요.</p>
  <h2>연결 정보</h2><div class="card"><div>지기 계정: knitup.official@gmail.com (뜨개동네 지기)</div><div>DB: Supabase thfcrodfaitzrzlrxyir (서울)</div><div>앱: <a href="https://yesbeyesnono.github.io/knit-neighbors/" target="_blank">yesbeyesnono.github.io/knit-neighbors</a></div><div>관리자 페이지 주소는 외부에 공개하지 마세요(검색 엔진 수집 차단됨).</div></div>`;
};
