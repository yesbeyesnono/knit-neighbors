<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>뜨개동네 관리자</title>
<style>
:root{--ink:#111;--ink2:#444;--ink3:#8a8a8a;--line:#e6e6e6;--bg:#fff;--bg2:#f6f6f6;--red:#c9303f;--green:#2f6b3a;--amber:#8a6d1a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:var(--ink);background:var(--bg2);word-break:keep-all}
a{color:inherit}
#gate{max-width:420px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center}
#app{display:none;grid-template-columns:200px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:14px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .brand{padding:6px 16px 14px;font-weight:800;font-size:15px}
aside .brand small{display:block;color:var(--ink3);font-weight:400;font-size:11px;margin-top:2px}
aside .grp{padding:10px 16px 4px;font-size:11px;color:var(--ink3)}
aside a{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;text-decoration:none;color:var(--ink2);font-size:13.5px}
aside a.on{background:#111;color:#fff}
aside a .n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;min-width:18px;text-align:center}
aside a.on .n{background:#fff;color:#111}
main{padding:22px 26px 60px;min-width:0}
h1{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h1 small{font-size:12px;color:var(--ink3);font-weight:400}
h2{font-size:15px;margin:22px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .l{font-size:12px;color:var(--ink3)}.card .v{font-size:22px;font-weight:700;margin-top:2px}
.card .s{font-size:12px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg2);font-weight:600;color:var(--ink2);font-size:12px}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#fafafa}
.muted{color:var(--ink3);font-size:12px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#f0f0f0;color:#333;margin-right:4px}
.chip.r{background:#fde8ea;color:var(--red)}.chip.g{background:#e8f3e8;color:var(--green)}.chip.y{background:#fbf6e6;color:var(--amber)}
button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
button.p{background:#111;color:#fff;border-color:#111}button.r{color:var(--red);border-color:#f2c9ce}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{width:100%;min-height:90px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tabs{display:flex;gap:6px;margin:0 0 12px}.tabs button.on{background:#111;color:#fff;border-color:#111}
.panel{position:fixed;top:0;right:0;width:min(560px,100%);height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.08);padding:20px 22px;overflow-y:auto;display:none;z-index:50}
.panel.on{display:block}.panel .x{position:fixed;top:12px;right:18px;z-index:60;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:49;display:none}#scrim.on{display:block}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.bar{display:flex;align-items:flex-end;gap:2px;height:80px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.bar i{flex:1;background:#111;border-radius:2px 2px 0 0;min-height:1px;position:relative}
.bar i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.hbar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.hbar b{height:12px;background:#111;border-radius:3px;display:block}
.hbar .w{background:var(--bg2);border-radius:3px}
.msg{padding:6px 10px;border-radius:12px;background:var(--bg2);margin:4px 0;max-width:80%;font-size:13px}
.msg.sup{background:#111;color:#fff;margin-left:auto}
.msg time{display:block;font-size:10px;opacity:.6;margin-top:2px}
.info{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.info svg{width:100%;height:auto;display:block}
.info .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.info .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 18px}
.info .kpi{background:var(--bg2);border-radius:12px;padding:10px 12px}.info .kpi .l{font-size:11px;color:var(--ink3)}.info .kpi .v{font-size:20px;font-weight:700}
.info h3{font-size:13px;margin:14px 0 6px;color:var(--ink2)}
.info .rk{display:grid;grid-template-columns:54px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.info .rk .w{background:var(--bg2);border-radius:3px}.info .rk b{display:block;height:10px;border-radius:3px;background:#111}
@media(max-width:900px){.info{grid-template-columns:1fr}}
#dongMap{height:520px;border:1px solid var(--line);border-radius:12px;background:#eee;z-index:1}
.leaflet-tooltip.dlabel{background:#111;color:#fff;border:0;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;box-shadow:none;white-space:nowrap}
.leaflet-tooltip.dlabel::before{display:none}
.legend{display:flex;gap:14px;align-items:center;margin:8px 2px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
pre{background:var(--bg2);border-radius:8px;padding:10px;font-size:12px;overflow:auto;white-space:pre-wrap}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:2px;padding:8px}aside .brand,aside .grp{width:100%}aside a{padding:6px 10px;border-radius:8px}main{padding:14px}}
</style></head>
<body>
<div id="gate">
  <div style="font-size:22px;font-weight:800">뜨개동네 관리자</div>

</div>
<div id="app">
  <aside>
    <div class="brand">뜨개동네 관리자<small id="who"></small></div>

    <a href="#today" data-v="today">오늘 (지기 AI) <span class="n" id="nMod" hidden></span></a>

    <div class="grp">운영</div>
    <a href="#reports" data-v="reports">신고함 <span class="n" id="nRep" hidden></span></a>
    <a href="#users" data-v="users">사용자</a>
    <a href="#support" data-v="support">지기 문의함 <span class="n" id="nSup" hidden></span></a>
    <a href="#kb" data-v="kb">지식 창고 (상담 학습)</a>
    <a href="#banned" data-v="banned">금칙어</a>
    <a href="#broadcast" data-v="broadcast">공지·알림 보내기</a>
    <a href="#shops" data-v="shops">파트너 가게</a>
    <a href="#patterns" data-v="patterns">도안</a>
    <a href="#authors" data-v="authors">작가 신청</a>
    <div class="grp">AI 데이터</div>
    <a href="#ai-photos" data-v="ai-photos">사진↔기법 라벨</a>
    <a href="#ai-path" data-v="ai-path">학습 경로</a>
    <a href="#ai-qa" data-v="ai-qa">질문·해결 답글</a>
    <a href="#ai-yarn" data-v="ai-yarn">실·바늘 통계</a>
    <a href="#supporters" data-v="supporters">1기 서포터즈</a>
    <a href="#events" data-v="events">이벤트 (레벨 초대·체험단)</a>
    <a href="#yarns" data-v="yarns">실 사전 (표준화)</a>
    <a href="#stash" data-v="stash">회원 실함</a>
    <a href="#export" data-v="export">내보내기</a>
    <div class="grp">시스템</div>
    <a href="#logs" data-v="logs">관리자 로그</a>
    <a href="#settings" data-v="settings">설정</a>
    <div style="padding:14px 16px"><button onclick="logout()" style="width:100%">로그아웃</button></div>
  </aside>
  <main id="main"></main>
</div>
<div id="scrim" onclick="closePanel()"></div>
<div class="panel" id="panel"><button class="x" onclick="closePanel()">✕</button><div id="panelBody"></div></div>
<div id="toast"></div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://thfcrodfaitzrzlrxyir.supabase.co', SB_KEY='sb_publishable_lOC6sE1BIpj5JZPnpwPCpg_DxvVvT2y';
const SUPPORT_ID='e120eb67-b254-4008-92d8-08c95c821e9e';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const fmtd=t=>t?new Date(t).toLocaleDateString('ko-KR'):'';
const ago=t=>{const d=(Date.now()-new Date(t))/1000; if(d<3600) return Math.max(1,Math.floor(d/60))+'분 전'; if(d<86400) return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전';};
const lv=p=>[p.level_crochet>0?'코바늘 '+p.level_crochet:'',p.level_knit>0?'대바늘 '+p.level_knit:''].filter(Boolean).join(' · ');
function toast(t){const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200);}
let me=null, TECH={}, STATS=null;
async function login(){ const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href.split('#')[0] } }); if(error) toast(error.message); }
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ return; }
  me=session.user; $('#gateMsg').textContent='권한 확인 중… ('+me.email+')'; $('#gateOut').style.display='inline-block';
  const { data:ok, error } = await sb.rpc('is_admin');
  if(error||!ok){ $('#gateMsg').textContent='이 계정('+me.email+')은 관리자가 아니에요. 설정에서 관리자로 등록된 계정으로 로그인하세요.'; $('#gateBtn').style.display='none'; return; }
  $('#gate').style.display='none'; $('#app').style.display='grid'; $('#who').textContent=me.email;
  const { data:t } = await sb.from('techniques').select('id,name_ko,craft,level'); (t||[]).forEach(x=>TECH[x.id]=x);
  refreshBadges(); route();
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN' && !me) init(); });
window.addEventListener('hashchange', route);
async function refreshBadges(){
  const [{count:a},{count:b}] = await Promise.all([sb.from('post_reports').select('*',{count:'exact',head:true}).is('reviewed_at',null), sb.from('reports').select('*',{count:'exact',head:true}).is('reviewed_at',null)]);
  const n=(a||0)+(b||0); $('#nRep').hidden=!n; $('#nRep').textContent=n;
  const {count:un}=await sb.from('support_tickets').select('id',{count:'exact',head:true}).in('status',['open','waiting_admin']); $('#nSup').hidden=!un; $('#nSup').textContent=un||'';
}
const VIEWS={};
function route(){ const [v,arg]=(location.hash||'#today').slice(1).split(':'); document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.v===v)); closePanel(); $('#main').innerHTML='<div class="muted">불러오는 중…</div>'; sb.from('mod_items').select('id',{count:'exact',head:true}).eq('status','open').then(({count})=>{ const n=$('#nMod'); if(n){ n.hidden=!count; n.textContent=count||''; } }); (VIEWS[v]||VIEWS.today)(arg).catch(e=>{ $('#main').innerHTML='<div class="muted">오류: '+esc(e.message)+'</div>'; }); }
function openPanel(html){ $('#panelBody').innerHTML=html; $('#panel').classList.add('on'); $('#scrim').classList.add('on'); }
function closePanel(){ $('#panel').classList.remove('on'); $('#scrim').classList.remove('on'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#panel').classList.contains('on') && !['TEXTAREA','INPUT'].includes(document.activeElement?.tagName)) closePanel(); else if(e.key==='Escape' && $('#panel').classList.contains('on')){ document.activeElement.blur(); } });
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
const jsonl=rows=>rows.map(r=>JSON.stringify(r)).join('\n');
const csv=(rows,cols)=>[cols.join(',')].concat(rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n');
async function stats(force){ if(STATS&&!force) return STATS; const { data, error } = await sb.rpc('admin_stats'); if(error) throw error; STATS=data; return data; }

// ===== 대시보드 =====
VIEWS.dash = async()=>{
  const s=await stats(true); const t=s.totals;
  const bar=(key,label)=>{ const max=Math.max(1,...s.daily.map(d=>d[key])); return `<div class="card"><div class="l">${label} · 최근 30일 (합계 ${s.daily.reduce((a,d)=>a+d[key],0)})</div><div class="bar">${s.daily.map(d=>`<i style="height:${Math.round(d[key]/max*100)}%" data-t="${d.d.slice(5)} · ${d[key]}"></i>`).join('')}</div></div>`; };
  const lvRow=(obj,label)=>`<div class="hbar"><span>${label}</span><span class="w">${[1,2,3,4,5].map(l=>`<span class="chip">${l}단계 ${obj[l]||0}</span>`).join('')}</span><span class="muted">${obj[0]||0} 없음</span></div>`;
  $('#main').innerHTML=`<h1>대시보드 <small>${new Date().toLocaleString('ko-KR')}</small></h1>
  <div class="cards">
    <div class="card"><div class="l">가입자</div><div class="v">${t.users}</div><div class="s">온보딩 완료 ${t.onboarded} · 정지 ${t.suspended}</div></div>
    <div class="card"><div class="l">활성 사용자</div><div class="v">${t.active7}</div><div class="s">7일 · 30일 ${t.active30}</div></div>
    <div class="card"><div class="l">글 / 답글</div><div class="v">${t.posts} / ${t.replies}</div><div class="s">좋아요·답글 활동 포함</div></div>
    <div class="card"><div class="l">작품 인증</div><div class="v">${t.works}</div><div class="s">해결된 질문 ${s.solved.solved}/${s.solved.questions_with_replies}</div></div>
    <div class="card"><div class="l">모임</div><div class="v">${t.meetups}</div><div class="s">예정 ${t.upcoming}</div></div>
    <div class="card"><div class="l">채팅</div><div class="v">${t.messages}</div><div class="s">방 ${t.rooms} · 친구 관계 ${t.friendships}</div></div>
    <div class="card"><div class="l">친구 찾는 중(손 들기)</div><div class="v">${t.waving}</div></div>
    <div class="card" style="${t.reports_open?'border-color:#c9303f':''}"><div class="l">미처리 신고</div><div class="v" style="${t.reports_open?'color:#c9303f':''}">${t.reports_open}</div><div class="s"><a href="#reports">신고함 열기</a></div></div>
  </div>
  <div class="cards">${bar('signups','가입')}${bar('posts','글·답글')}${bar('works','작품 인증')}${bar('messages','채팅 메시지')}</div>
  <h2>뜨개 단계 분포</h2><div class="card">${lvRow(s.levels.crochet,'코바늘')}${lvRow(s.levels.knit,'대바늘')}</div>`;
};
// ===== 동네 분포 =====
let dongTab='info', KR=null;
const SIDO_SHORT={'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원도':'강원','충청북도':'충북','충청남도':'충남','전라북도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
const SIDO_LABEL={'서울':[126.98,37.56],'부산':[129.08,35.2],'대구':[128.58,35.85],'인천':[126.38,37.58],'광주':[126.85,35.15],'대전':[127.4,36.33],'울산':[129.28,35.55],'세종':[127.27,36.58],'경기':[127.42,37.2],'강원':[128.3,37.75],'충북':[127.75,36.9],'충남':[126.75,36.5],'전북':[127.1,35.75],'전남':[126.95,34.85],'경북':[128.8,36.4],'경남':[128.2,35.35],'제주':[126.55,33.38]};
function inRing(x,y,ring){ let c=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function sidoOf(lng,lat){ for(const f of KR){ if(f.rings.some(r=>inRing(lng,lat,r))) return SIDO_SHORT[f.name]||f.name; } let best=null,bd=1e9; for(const [k,[x,y]] of Object.entries(SIDO_LABEL)){ const dd=(x-lng)**2+(y-lat)**2; if(dd<bd){bd=dd;best=k;} } return best; }
VIEWS.dong = async()=>{
  const { data:m, error } = await sb.rpc('admin_dong_map'); if(error) throw error;
  const tabs=`<div class="tabs"><button class="${dongTab==='info'?'on':''}" onclick="dongTab='info';route()">전국 인포그래픽</button><button class="${dongTab==='map'?'on':''}" onclick="dongTab='map';route()">상세 지도</button></div>`;
  if(dongTab==='map') return renderDongLeaflet(m, tabs);
  if(!KR){ const r=await fetch('kr-provinces.json'); KR=await r.json(); }
  const dongs=(m.dongs||[]).filter(d=>d.lat!=null); const total=dongs.reduce((a,d)=>a+d.n,0); const waving=dongs.reduce((a,d)=>a+(d.waving||0),0);
  const bySido={}; dongs.forEach(d=>{ d.sido=sidoOf(d.lng,d.lat); bySido[d.sido]=(bySido[d.sido]||0)+d.n; });
  const maxS=Math.max(1,...Object.values(bySido));
  // 투영: 경도 124.6~131.0, 위도 33.0~38.7 (위도 36°에서 가로 보정)
  const W=560,H=640,k=Math.cos(36*Math.PI/180), X0=124.6,X1=131.0,Y0=33.0,Y1=38.75; const sx=W/((X1-X0)*k), sy=H/(Y1-Y0), sc=Math.min(sx,sy);
  const PX=lng=>((lng-X0)*k)*sc+ (W-(X1-X0)*k*sc)/2, PY=lat=>(Y1-lat)*sc;
  const shade=n=>{ if(!n) return '#ececec'; const t=Math.sqrt(n/maxS); const v=Math.round(200-t*183); return `rgb(${v},${v},${v})`; };
  const paths=KR.map(f=>{ const sn=SIDO_SHORT[f.name]; const n=bySido[sn]||0; return `<path d="${f.rings.map(r=>'M'+r.map(([x,y])=>PX(x).toFixed(1)+','+PY(y).toFixed(1)).join('L')+'Z').join('')}" fill="${shade(n)}" stroke="#fff" stroke-width="1"><title>${f.name} ${n}명</title></path>`; }).join('');
  const labels=Object.entries(SIDO_LABEL).map(([sn,[x,y]])=>{ const n=bySido[sn]||0; const dark=n && Math.sqrt(n/maxS)>.45; return `<text x="${PX(x).toFixed(1)}" y="${PY(y).toFixed(1)}" text-anchor="middle" font-size="${n?12:10}" font-weight="${n?700:400}" fill="${dark?'#fff':n?'#111':'#9a9a9a'}">${sn}${n?' '+n:''}</text>`; }).join('');
  const maxD=Math.max(1,...dongs.map(d=>d.n));
  const bubbles=dongs.slice().sort((a,b)=>b.n-a.n).map(d=>`<circle cx="${PX(d.lng).toFixed(1)}" cy="${PY(d.lat).toFixed(1)}" r="${(4+Math.sqrt(d.n/maxD)*12).toFixed(1)}" fill="#ff3040" fill-opacity=".8" stroke="${d.waving?'#ffb300':'#fff'}" stroke-width="${d.waving?2.5:1.2}"><title>${esc(d.dong)} ${d.n}명${d.waving?' · 친구 찾는 중 '+d.waving:''}</title></circle>`).join('');
  const sq=(x,y,c,t)=>`<rect x="${(PX(x)-4).toFixed(1)}" y="${(PY(y)-4).toFixed(1)}" width="8" height="8" rx="2" fill="${c}" stroke="#fff" stroke-width="1.2"><title>${esc(t)}</title></rect>`;
  const extras=(m.meetups||[]).filter(x=>x.lat!=null).map(x=>sq(x.lng,x.lat,'#185fa5','모임 · '+x.title)).join('')+(m.shops||[]).filter(x=>x.lat!=null).map(x=>sq(x.lng,x.lat,'#111','가게 · '+x.name)).join('');
  // 수도권 확대 인셋 (동해 쪽 빈 공간에 배치): 사용자가 몰린 서울·경기 동네를 이름과 함께 표시
  const IX=372, IY=250, IW=180, IH=170, bx0=126.55, bx1=127.35, by0=37.2, by1=37.8; const isc=Math.min(IW/((bx1-bx0)*k), IH/(by1-by0));
  const QX=lng=>IX+((lng-bx0)*k)*isc, QY=lat=>IY+(by1-lat)*isc;
  const inBox=d=>d.lng>=bx0&&d.lng<=bx1&&d.lat>=by0&&d.lat<=by1;
  const insetPaths=KR.filter(f=>['서울특별시','경기도','인천광역시'].includes(f.name)).map(f=>`<path d="${f.rings.map(r=>'M'+r.map(([x,y])=>QX(x).toFixed(1)+','+QY(y).toFixed(1)).join('L')+'Z').join('')}" fill="${f.name==='서울특별시'?'#dcdcdc':'#efefef'}" stroke="#fff" stroke-width="1"/>`).join('');
  const insetDongs=dongs.filter(inBox).sort((a,b)=>b.n-a.n);
  const insetBubbles=insetDongs.map((d,i)=>`<circle cx="${QX(d.lng).toFixed(1)}" cy="${QY(d.lat).toFixed(1)}" r="${(4+Math.sqrt(d.n/maxD)*9).toFixed(1)}" fill="#ff3040" fill-opacity=".85" stroke="${d.waving?'#ffb300':'#fff'}" stroke-width="${d.waving?2.2:1}"><title>${esc(d.dong)} ${d.n}명</title></circle>${i<6?`<text x="${(QX(d.lng)+8+Math.sqrt(d.n/maxD)*9).toFixed(1)}" y="${(QY(d.lat)+3.5).toFixed(1)}" font-size="9.5" font-weight="600" fill="#111" paint-order="stroke" stroke="#fff" stroke-width="2.5">${esc(d.dong)} ${d.n}</text>`:''}`).join('');
  const inset = insetDongs.length ? `<rect x="${PX(bx0).toFixed(1)}" y="${PY(by1).toFixed(1)}" width="${(PX(bx1)-PX(bx0)).toFixed(1)}" height="${(PY(by0)-PY(by1)).toFixed(1)}" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 2"/><line x1="${PX(bx1).toFixed(1)}" y1="${PY(by1).toFixed(1)}" x2="${IX}" y2="${IY}" stroke="#111" stroke-width=".7" stroke-dasharray="3 2"/><line x1="${PX(bx1).toFixed(1)}" y1="${PY(by0).toFixed(1)}" x2="${IX}" y2="${IY+IH}" stroke="#111" stroke-width=".7" stroke-dasharray="3 2"/><clipPath id="insetClip"><rect x="${IX}" y="${IY}" width="${IW}" height="${IH}" rx="10"/></clipPath><rect x="${IX}" y="${IY}" width="${IW}" height="${IH}" rx="10" fill="#fafafa" stroke="#111" stroke-width="1"/><g clip-path="url(#insetClip)">${insetPaths}${insetBubbles}</g><text x="${IX+8}" y="${IY+15}" font-size="10.5" font-weight="700" fill="#111">수도권 확대</text>` : '';
  const sidoRank=Object.entries(bySido).sort((a,b)=>b[1]-a[1]);
  $('#main').innerHTML=`<h1>동네 분포 <small>${new Date().toLocaleDateString('ko-KR')} 기준</small></h1>${tabs}
  <div class="info">
    <div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="전국 사용자 분포">${paths}${labels}${extras}${bubbles}${inset}</svg>
      <div class="legend"><span><i style="background:#ff3040"></i>동네(원 크기 = 사용자 수)</span><span><i style="background:#fff;border:2.5px solid #ffb300"></i>친구 찾는 중 있음</span><span><i style="background:#185fa5;border-radius:3px"></i>예정 모임</span><span><i style="background:#111;border-radius:3px"></i>파트너 가게</span></div></div>
    <div>
      <div class="muted">뜨개동네 이웃</div><div class="big">${total}<span style="font-size:18px;font-weight:600">명</span></div>
      <div class="kpis"><div class="kpi"><div class="l">활동 동네</div><div class="v">${dongs.length}곳</div></div><div class="kpi"><div class="l">시·도</div><div class="v">${sidoRank.length}곳</div></div><div class="kpi"><div class="l">친구 찾는 중</div><div class="v">${waving}명</div></div><div class="kpi"><div class="l">예정 모임 · 가게</div><div class="v">${(m.meetups||[]).length} · ${(m.shops||[]).length}</div></div></div>
      <h3>시·도별</h3>${sidoRank.map(([sn,n])=>`<div class="rk"><span>${sn}</span><span class="w"><b style="width:${Math.round(n/maxS*100)}%"></b></span><span class="muted">${n}</span></div>`).join('')||'<div class="muted">데이터 없음</div>'}
      <h3>동네 상위 10</h3>${dongs.slice().sort((a,b)=>b.n-a.n).slice(0,10).map(d=>`<div class="rk" style="grid-template-columns:110px 1fr 34px"><span>${esc(d.dong)} <span class="muted">${d.sido||''}</span></span><span class="w"><b style="width:${Math.round(d.n/maxD*100)}%;background:#ff3040"></b></span><span class="muted">${d.n}</span></div>`).join('')}
    </div>
  </div>
  <p class="muted">시·도는 저장된 좌표(200m 격자)로 판정해요. 원·도형에 마우스를 올리면 이름과 수가 보여요. 동네 단위로 확대해 보려면 "상세 지도" 탭.</p>`;
};
function renderDongLeaflet(m, tabs){
  const dongs=m.dongs||[]; const max=Math.max(1,...dongs.map(d=>d.n)); const total=dongs.reduce((a,d)=>a+d.n,0);
  $('#main').innerHTML=`<h1>동네 분포 <small>사용자 ${total}명 · 동네 ${dongs.length}곳 · 원이 클수록 사용자가 많아요</small></h1>${tabs}
  <div id="dongMap"></div>
  <div class="legend"><span><i style="background:#111"></i>사용자(동네별)</span><span><i style="background:#ffb300"></i>친구 찾는 중 포함</span><span><i style="background:#185fa5;border-radius:3px"></i>예정 모임 ${m.meetups.length}</span><span><i style="background:#c9303f;border-radius:3px"></i>파트너 가게 ${m.shops.length}</span></div>
  <h2>동네별 순위</h2><div class="card">${dongs.map(d=>`<div class="hbar" style="cursor:pointer" onclick="focusDong(${d.lat},${d.lng})"><span>${esc(d.dong)}</span><span class="w"><b style="width:${Math.round(d.n/max*100)}%"></b></span><span class="muted">${d.n}</span></div>`).join('')||'<div class="muted">데이터 없음</div>'}</div>`;
  if(typeof L==='undefined'){ $('#dongMap').innerHTML='<div class="muted" style="padding:20px">지도 라이브러리를 불러오지 못했어요</div>'; return; }
  const map=L.map('dongMap',{scrollWheelZoom:true}); window._dongMap=map;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  const pts=[];
  dongs.forEach(d=>{ if(d.lat==null) return; pts.push([d.lat,d.lng]);
    const r=10+Math.sqrt(d.n)*9;
    L.circleMarker([d.lat,d.lng],{radius:r,color:d.waving?'#ffb300':'#111',weight:d.waving?3:1.5,fillColor:'#111',fillOpacity:.55})
      .bindTooltip(`${d.dong} ${d.n}`,{permanent:true,direction:'center',className:'dlabel'})
      .bindPopup(`<b>${esc(d.dong)}</b><br>사용자 ${d.n}명${d.waving?`<br>친구 찾는 중 ${d.waving}명`:''}`).addTo(map); });
  m.meetups.forEach(x=>{ if(x.lat==null) return; pts.push([x.lat,x.lng]); L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html:'<div style="width:14px;height:14px;background:#185fa5;border:2px solid #fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>',iconSize:[14,14]})}).bindPopup(`<b>${esc(x.title)}</b><br>${esc(x.place||'')}<br>${fmt(x.starts_at)} · 참여 ${x.n||0}`).addTo(map); });
  m.shops.forEach(x=>{ if(x.lat==null) return; pts.push([x.lat,x.lng]); L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html:'<div style="width:14px;height:14px;background:#c9303f;border:2px solid #fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>',iconSize:[14,14]})}).bindPopup(`<b>${esc(x.name)}</b><br>파트너 가게`).addTo(map); });
  map.setView([37.5665,126.978],11);
  const fit=()=>{ map.invalidateSize(); if(pts.length) map.fitBounds(pts,{padding:[50,50],maxZoom:13}); };
  setTimeout(fit, 300); setTimeout(fit, 1200);
}

async function shrinkImage(file, max){
  const draw=(src,w,h)=>{ const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',0.85)); };
  if(window.createImageBitmap){ try{ const bm=await createImageBitmap(file,{imageOrientation:'from-image'}); const out=await draw(bm,bm.width,bm.height); bm.close?.(); if(out) return out; }catch(e){} }
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=async()=>{ const out=await draw(img,img.width,img.height); URL.revokeObjectURL(img.src); out?res(out):rej(new Error('사진을 처리하지 못했어요')); }; img.onerror=()=>rej(new Error('이 사진 형식은 열 수 없어요. JPG/PNG로 올려 주세요')); img.src=URL.createObjectURL(file); });
}

function parseGeo(hex){ try{ if(typeof hex!=='string')return null; const b=new Uint8Array(hex.match(/../g).map(h=>parseInt(h,16))); const dv=new DataView(b.buffer); const le=b[0]===1; let o=5; const type=dv.getUint32(1,le); if(type&0x20000000)o+=4; const x=dv.getFloat64(o,le), y=dv.getFloat64(o+8,le); return {lat:y,lng:x}; }catch(e){ return null; } }

// 텔레그램과 같은 mod_items·같은 도구(jigi_tool)를 쓴다. 콘솔에서의 클릭 = 대표 승인(admin_jigi_tool).
const MK={abuse:'비방·욕설',spam:'광고 의심',scam:'사기 의심',app_complaint:'앱 불만',risk:'위험',report:'신고',tech_candidate:'기법 후보',yarn_review:'실 이름 검토',support:'문의',other:'기타'}, MSEV={urgent:'긴급',today:'오늘',info:'참고'};
const jigi=async(route,body={})=>{ const {data,error}=await sb.functions.invoke('jigi',{body:{route,...body}}); if(error) throw new Error(error.message); return data; };
const jtool=async(name,args)=>{ const {data,error}=await sb.rpc('admin_jigi_tool',{p_name:name,p_args:args}); if(error) throw new Error(error.message); if(data?.error) throw new Error(data.error); return data; };
async function jsteps(item, steps){ for(const [i,s] of steps.entries()) await jtool(s[0], {...s[1], item_id:item.id, resolve:i===steps.length-1 && s[0]!=='dismiss_item'}); }
const WARN_TXT=n=>`${n||'회원'}님, 다른 이웃을 향한 표현 때문에 글이 가려졌어요. 뜨개동네는 서로 존중하는 말만 허용해요. 다시 반복되면 글쓰기가 제한될 수 있어요.`;
let MOD_ITEMS=[];
function modButtons(it){
  const pid=it.target_type==='post'?it.target_id:null, b=[];
  if(pid && ['abuse','report','risk'].includes(it.kind)){ b.push(['경고 보내고 숨김','warn','p']); b.push(['숨김 해제','ok','']); }
  else if(pid && ['spam','scam'].includes(it.kind)){ b.push(['제안대로 처리 (숨김+7일 제한)','spam','p']); b.push(['문제 없음','ok','']); }
  else if(pid && it.kind==='app_complaint'){ b.push(['답글 보내기','reply','p']); b.push(['확인함','seen','']); }
  else if(it.kind==='tech_candidate'){ b.push(['후보 보기','tech','p']); b.push(['나중에','seen','']); }
  else if(it.kind==='yarn_review'){ b.push(['실 사전 열기','yarn','p']); b.push(['확인함','seen','']); }
  else if(it.kind==='support'){ b.push(['문의함에서 답변','support','p']); }
  else b.push(['확인함','seen','']);
  return b.map(([l,a,c])=>`<button class="${c}" onclick="modAct(${it.id},'${a}')">${l}</button>`).join(' ')+` <button onclick="openModItem(${it.id})">자세히</button>`;
}
async function modAct(id, act){
  const it=MOD_ITEMS.find(x=>x.id===id)||(await sb.from('mod_items').select('*').eq('id',id).single()).data; if(!it) return; const pid=it.target_id;
  try{
    if(act==='warn'){ const t=prompt('작성자에게 보낼 경고 문구 (숨김은 유지돼요)', it.ai_suggestion?.warning_text||WARN_TXT(it.evidence?.nickname)); if(t===null) return; await jsteps(it,[['hide_temp',{post_id:pid}],['send_warning',{user_id:it.author_id,text:t}],['notify_reporter',{post_id:pid}]]); }
    else if(act==='ok'){ if(!confirm('숨김을 풀고 문제 없음으로 닫을까요?')) return; await jsteps(it,[['unhide',{post_id:pid}],['dismiss_item',{note:'문제 없음'}]]); }
    else if(act==='spam'){ if(!confirm('글을 숨기고 작성자의 글쓰기를 7일 제한할까요?')) return; await jsteps(it,[['hide_temp',{post_id:pid}],['restrict_posting',{user_id:it.author_id,days:7}]]); }
    else if(act==='restrict'){ if(!confirm('작성자의 글쓰기를 7일 제한할까요?')) return; await jtool('restrict_posting',{user_id:it.author_id,days:7,item_id:it.id}); }
    else if(act==='keep'){ await jsteps(it,[['hide_temp',{post_id:pid}]]); }
    else if(act==='notify'){ const t=prompt('신고자에게 보낼 결과 알림', '신고해 주신 내용을 확인하고 조치했어요. 알려 주셔서 고마워요.'); if(t===null) return; await jtool('notify_reporter',{post_id:pid,text:t,item_id:it.id}); }
    else if(act==='reply'){ const t=prompt('지기 이름으로 달 답글', it.ai_suggestion?.reply_draft||''); if(!t) return; await jsteps(it,[['reply_as_jigi',{post_id:pid,text:t}]]); }
    else if(act==='seen'){ await jtool('dismiss_item',{item_id:it.id,note:'확인'}); }
    else if(act==='tech'){ location.hash='#techcand'; return; }
    else if(act==='yarn'){ location.hash='#yarns'; return; }
    else if(act==='support'){ location.hash='#support:'+(it.evidence?.ticket_id||it.target_id); return; }
    toast('처리했어요 · 기록에서 되돌릴 수 있어요'); closePanel(); if(location.hash.startsWith('#today')||!location.hash) VIEWS.today(); refreshBadges&&refreshBadges();
  }catch(e){ toast('실패: '+e.message); }
}

async function savePattern(id){
  const craft=$('#ptCraft').value; const url=$('#ptUrl').value.trim();
  const p={ title:$('#ptTitle').value.trim(), craft, level:+$('#ptLevel').value, price:Math.max(0,+$('#ptPrice').value||0), descr:$('#ptDescr').value.trim()||null, yarn_weight:$('#ptYarn').value.trim()||null, needle_size:$('#ptNeedle').value.trim()||null, buy_url:url, photos:$('#ptPhotos').value.split(',').map(v=>v.trim()).filter(Boolean), techniques:[...ptSel].filter(t=>PTECH.find(k=>k.id===t&&k.craft===craft)), is_published:$('#ptPub').checked, hidden:$('#ptHidden').checked, author_id:$('#ptAuthorId').value||'' };
  if(!p.title) return toast('도안 이름을 입력하세요');
  if(url && !/^https?:\/\//i.test(url)) return toast('링크는 http(s)://로 시작해야 해요');
  if(id) p.id=id;
  const pf=$('#ptPkg').files[0]; let pkg=null;
  if(pf){ try{ pkg=JSON.parse(await pf.text()); if(pkg.app!=='knitup-pattern-package') throw 0; }catch(e){ return toast('knitup 도안 패키지 형식이 아니에요'); } }
  const {data:pid,error}=await sb.rpc('admin_upsert_pattern',{p}); if(error) return toast(error.message);
  if(pkg || $('#ptPkgDel')?.checked){ const r2=await sb.rpc('set_pattern_pkg',{p_id:pid,p_pkg:pkg}); if(r2.error) return toast('패키지 첨부 실패: '+r2.error.message); }
  toast('저장했어요'); closePanel(); route();
}
async function showClaimDoc(path){ const {data,error}=await sb.storage.from('shop-docs').createSignedUrl(path, 600); if(error) return toast(error.message); window.open(data.signedUrl,'_blank','noopener'); }
async function decideClaim(id, ok, docPath){
  let reason=null; if(!ok){ reason=prompt('반려 사유 (신청자에게 전달돼요)'); if(reason===null) return; } else if(!confirm('승인할까요? 신청 계정이 가게 오너가 됩니다.')) return;
  const {data:sid,error}=await sb.rpc('admin_decide_shop_claim',{p_id:id,p_approve:ok,p_reason:reason}); if(error) return toast(error.message);
  if(docPath) await sb.storage.from('shop-docs').remove([docPath]);
  toast(ok?'승인했어요. 좌표를 넣고 공개로 바꿔 주세요':'반려했어요'); await route(); if(ok&&sid) openShopForm(sid);
}
