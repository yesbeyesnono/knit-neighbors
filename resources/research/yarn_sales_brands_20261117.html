const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chart(c){
  const W=460,H=200,L=10,R=10,T=26,Bt=28,n=c.d.length,max=Math.max(...c.d.map(x=>x[1]));
  const bw=Math.min(56,(W-L-R)/n*0.6),step=(W-L-R)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.t)}"><line class="ax" x1="${L}" x2="${W-R}" y1="${H-Bt}" y2="${H-Bt}"/>`;
  c.d.forEach((d,i)=>{const h=(H-T-Bt)*d[1]/max,x=L+step*i+(step-bw)/2,y=H-Bt-h;
    s+=`<rect class="bar${d[2]?' est':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4"/>`+
       `<text class="vt" x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle">${d[1]}</text>`+
       `<text class="xt" x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle">${esc(d[0])}</text>`;});
  return `<div class="chart"><div class="lbl">숫자 흐름</div>${s}</svg><div class="cap">${esc(c.t)}${c.d.some(d=>d[2])?' · 회색 = 추정치':''}</div></div>`;
}
function sheet(b,i){

  const fun=b.funnel.map(f=>`<div class="step" style="--c:${ST[f[0]][1]}"><div class="k">${ST[f[0]][0]}</div><div class="t">${esc(f[1])}</div><div class="d">${esc(f[2])}</div></div>`).join('');
  const tl=b.tl.map(t=>`<div class="${t[2]?'hot':''}"><b>${esc(t[0])}</b>${esc(t[1])}</div>`).join('');
  return `<section class="sheet" id="${b.id}">
   <div class="sh-head"><span class="idx">${String(i+1).padStart(2,'0')} · ${b.grp}</span><h2>${esc(b.name)}</h2><span class="tag">${esc(b.tag)}</span></div>
   <div class="who">${esc(b.who)}</div>
   <div class="tiles">${tiles}</div>
   <div><div class="lbl">판매 깔때기 — 처음 만남부터 다시 사기까지</div><div class="funnel">${fun}</div></div>
   <div class="cols"><div><div class="lbl">연표</div><div class="tl">${tl}</div></div>${b.chart?chart(b.chart):'<div class="note" style="align-self:center">연도별 숫자는 공개 자료에서 찾지 못했어요.</div>'}</div>
   <div class="lesson"><div class="learn"><h4>knitup 이 배울 점</h4>${esc(b.learn)}</div><div class="threat"><h4>위협 · 주의</h4>${esc(b.threat)}</div></div>
   <div class="src">출처: ${b.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}</div>
  </section>`;
}
