# Codemagic CI — Mac 없이 iOS 빌드 → TestFlight 업로드
# 사전 준비(Codemagic 웹에서 1회):
#   1) codemagic.io 가입 → GitHub yesbeyesnono/knit-neighbors 연결
#   2) Settings › Integrations › Developer Portal: App Store Connect API 키(.p8, Key ID, Issuer ID) 등록, 이름 "firmtech_asc"
#   3) 앱 › Environment variables: 그룹 ios_creds 에 CERTIFICATE_PRIVATE_KEY(RSA 개인키 PEM, Secure 체크) 추가
#      → 빌드 중 app-store-connect fetch-signing-files --create 가 배포 인증서·App Store 프로파일을 자동 생성
#   4) App Store Connect에서 앱(kr.co.firmtech.knitneighbors) 먼저 생성
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: firmtech_asc
    environment:
      groups:
        - ios_creds
      vars:
        BUNDLE_ID: "kr.co.firmtech.knitneighbors"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: 의존성 설치·웹 자산 동기화
        script: |
          npm ci
          npx cap sync ios
      - name: 서명 파일 준비(인증서·프로파일 자동 생성)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: 빌드 번호 증가
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: IPA 빌드
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
